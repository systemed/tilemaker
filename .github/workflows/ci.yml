  # Each platform builds on a runner of its own architecture: arm64 under
  # QEMU emulation on an x86 runner took 30-40 minutes.
  docker-build:
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    name: docker-build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs:
      - changes
      - static-validation
    if: ${{ needs.changes.outputs.runtime == 'true' && github.ref != 'refs/heads/master' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Read tilemaker version
        id: version
        run: |
          version="$(sed -n '1p' VERSION)"
          build_version="v${version}+nogit"

          if git rev-parse --git-dir >/dev/null 2>&1; then
            sha="$(git rev-parse --short=12 HEAD 2>/dev/null || true)"
            if [ -n "${sha}" ]; then
              tag="$(git describe --exact-match --tags HEAD 2>/dev/null || true)"
              dirty=
              if git diff-index --quiet HEAD -- 2>/dev/null; then
                dirty_result=0
              else
                dirty_result="$?"
              fi
              if [ "${dirty_result}" -eq 1 ]; then
                dirty=.dirty
              fi

              if [ "${tag}" = "v${version}" ] && [ -z "${dirty}" ]; then
                build_version="v${version}"
              else
                build_version="v${version}+g${sha}${dirty}"
              fi
            fi
          fi

          {
            echo "version=${version}"
            echo "build_version=${build_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TILEMAKER_VERSION=${{ steps.version.outputs.version }}
            TILEMAKER_BUILD_VERSION=${{ steps.version.outputs.build_version }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max

  # Pushes each platform's image by digest, from a runner of its own
  # architecture; docker-publish then tags them as one multi-platform image.
  docker-publish-platform:
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    name: docker-publish-platform (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs:
      - changes
      - static-validation
    if: ${{ needs.changes.outputs.runtime == 'true' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Read tilemaker version
        id: version
        run: |
          version="$(sed -n '1p' VERSION)"
          build_version="v${version}+nogit"

          if git rev-parse --git-dir >/dev/null 2>&1; then
            sha="$(git rev-parse --short=12 HEAD 2>/dev/null || true)"
            if [ -n "${sha}" ]; then
              tag="$(git describe --exact-match --tags HEAD 2>/dev/null || true)"
              dirty=
              if git diff-index --quiet HEAD -- 2>/dev/null; then
                dirty_result=0
              else
                dirty_result="$?"
              fi
              if [ "${dirty_result}" -eq 1 ]; then
                dirty=.dirty
              fi

              if [ "${tag}" = "v${version}" ] && [ -z "${dirty}" ]; then
                build_version="v${version}"
              else
                build_version="v${version}+g${sha}${dirty}"
              fi
            fi
          fi

          {
            echo "version=${version}"
            echo "build_version=${build_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            TILEMAKER_VERSION=${{ steps.version.outputs.version }}
            TILEMAKER_BUILD_VERSION=${{ steps.version.outputs.build_version }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - docker-publish-platform
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Create and push the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
